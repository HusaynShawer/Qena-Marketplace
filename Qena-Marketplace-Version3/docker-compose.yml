version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qena_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qena_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qena_pass}
      POSTGRES_DB: ${POSTGRES_DB:-qena_marketplace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qena_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: qena_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qena_user}:${POSTGRES_PASSWORD:-qena_pass}@postgres:5432/${POSTGRES_DB:-qena_marketplace}
      SECRET_KEY: ${SECRET_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: qena_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data: